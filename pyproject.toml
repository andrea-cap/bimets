[project]
name = "bimets"
version = "1.0.0"
description = "Time-series analysis and econometric modelling in Python"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Andrea C.", email = "andrea.cap.dev@icloud.com" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.15",
]

[project.urls]
"Original BIMETS" = "https://github.com/andrea-luciani/bimets"

[dependency-groups]
dev = [
    "bump-my-version>=1.4",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.bumpversion]
current_version = "1.0.0"
commit = false
tag = false

[tool.hatch.build.targets.wheel]
packages = ["src/bimets"]

[tool.pytest.ini_options]
markers = [
    "integration: cross-component functional integration test",
    "source(origin): provenance of a test: native, bimets-R, or a publication DOI",
]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--doctest-modules",
    "--cov=bimets",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=95",
    "-ra",
]
testpaths = ["tests", "src/bimets"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["bimets"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["bimets"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "scipy", "scipy.*"]
ignore_missing_imports = true
